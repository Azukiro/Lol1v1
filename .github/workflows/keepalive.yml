# Garde l'API Render (plan gratuit) éveillée : sans requête pendant 15 min, le service s'endort
# et le premier appel attend jusqu'à une minute (démarrage à froid). Un ping toutes les 10 min l'évite
# et laisse tourner le notificateur des reliques. Un seul service éveillé tient dans les 750 h/mois gratuites.
# GitHub peut décaler les tâches planifiées de quelques minutes : le ping garde de la marge sous les 15 min.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL || 'https://lol1v1-api.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "$API_URL/health"
