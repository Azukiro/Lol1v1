appId: fr.duelyst.app
productName: Duelyst
directories:
  output: release
  buildResources: build
files:
  - dist/client/browser/**
  - dist-electron/**
  - "!dist-electron/src/shared/*.test.js"
  - electron/overlay.html
  - package.json
win:
  target: nsis
  # Généré depuis build/icon.svg (logo du site) par scripts/make-icon.js.
  icon: build/icon.ico
  # Nom de fichier neutre, servi tel quel par /download.
  artifactName: launcher-setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
# Mise à jour automatique : le premier fournisseur est celui que l'app interroge.
# generic = /updates de l'API (installeur embarqué dans l'image Docker du serveur).
# github  = transition : les apps installées avant le passage au serveur y prennent la version
#           qui bascule sur /updates. À retirer avant de passer le dépôt en privé.
publish:
  - provider: generic
    url: ${env.API_URL}/updates
  - provider: github
    owner: Azukiro
    repo: Lol1v1
    releaseType: draft
