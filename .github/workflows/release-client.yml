name: Release client Windows

# Chaque push sur dev qui touche au client publie une nouvelle version 0.1.<n°>
# dans GitHub Releases. Les apps installées la détectent, la téléchargent en arrière-plan
# et l'installent à la fermeture (ou tout de suite via « Redémarrer »).
on:
  push:
    branches: [dev]
    paths: ['client/**', '.github/workflows/release-client.yml']
  workflow_dispatch:

permissions:
  contents: write   # le GITHUB_TOKEN intégré suffit pour publier la Release (pas de PAT nécessaire)

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Version strictement croissante : la mise à jour automatique compare les numéros de version.
      # Le tag doit exister avant la publication (GitHub refuse de publier une Release sans tag).
      - name: Version et tag
        shell: bash
        run: |
          VERSION="0.1.$((${{ github.run_number }} + 100))"
          npm version "$VERSION" --no-git-tag-version
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - run: npm test
      - run: npm run release
        env:
          API_URL: ${{ vars.API_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
