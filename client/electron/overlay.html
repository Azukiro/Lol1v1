<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LoL 1v1 – overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 6px; box-sizing: border-box; }
  .bar {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 16px 10px 14px; box-sizing: border-box;
    color: #f2f5fa; background: rgba(10, 13, 20, 0.88); border: 1px solid color-mix(in srgb, var(--tone) 60%, transparent);
    border-left: 4px solid var(--tone); border-radius: 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    animation: drop 0.3s ease-out, settle 0.6s ease 10s forwards;
  }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 800; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tone); }
  .subtitle { font-size: 12px; color: #b7c0cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .footer { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #f2f5fa; margin-top: 2px; }
  .score { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; }
  @keyframes drop { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Après 10 s, le bandeau s'efface à moitié pour gêner encore moins. */
  @keyframes settle { to { opacity: 0.7; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="text">
      <div class="title" id="title"></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="footer" id="footer"></div>
    </div>
    <div class="score" id="score"></div>
  </div>
  <script>
    const data = __DATA__;
    const tones = { win: '#19e3ff', loss: '#ff3366', info: '#ffc94d' };
    document.documentElement.style.setProperty('--tone', tones[data.tone] || tones.info);
    document.getElementById('title').textContent = data.title;
    document.getElementById('subtitle').textContent = data.subtitle;
    document.getElementById('score').textContent = data.score;
    document.getElementById('footer').textContent = data.footer;
  </script>
</body>
</html>
